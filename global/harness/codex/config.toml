# Keys and tables here are merged into ~/.codex/config.toml by `rig apply`.
# Anything not listed (project trust, marketplaces, plugin state, app paths) is left to Codex.
model = "gpt-6-astra"
model_reasoning_effort = "low"
plan_mode_reasoning_effort = "xhigh"
service_tier = "default"
default_permissions = ":danger-full-access"
approval_policy = "never"

[notice]
hide_rate_limit_model_nudge = true
fast_default_opt_out = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-used"]

[features]
goals = true
js_repl = false

[desktop]
ambient-suggestions-enabled = false
appearanceTheme = "system"
git-branch-prefix = ""
conversationDetailMode = "STEPS_COMMANDS"
default-service-tier = "priority"
preventSleepWhileRunning = true
notifications-turn-mode = "always"
followUpQueueMode = "queue"
dock-icon-preference = "codex-system"
keepRemoteControlAwakeWhilePluggedIn = true
worktree-auto-cleanup-enabled = false
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]
show-context-window-usage = true

[mcp_servers.code-review-graph]
command = "uvx"
args = ["code-review-graph", "serve"]
type = "stdio"

[mcp_servers.code-review-graph.tools.get_minimal_context_tool]
approval_mode = "approve"

[mcp_servers.code-review-graph.tools.semantic_search_nodes_tool]
approval_mode = "approve"

[mcp_servers.code-review-graph.tools.build_or_update_graph_tool]
approval_mode = "approve"

[mcp_servers.code-review-graph.tools.detect_changes_tool]
approval_mode = "approve"

[mcp_servers.code-review-graph.tools.query_graph_tool]
approval_mode = "approve"

[mcp_servers.code-review-graph.tools.get_architecture_overview_tool]
approval_mode = "approve"

[[skills.config]]
name = "github:gh-address-comments"
enabled = false
